# MobilTarif landing page: the static Next.js export served from
# /usr/share/nginx/html. Hashed /_next/static assets are cached for a year,
# media for a month, HTML never. Security headers come from
# docker/headers.conf, included per location.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates at the proxy, so $scheme here is http. Relative Location
    # headers let the browser keep the scheme it arrived on.
    absolute_redirect off;

    # Compress text; media (webp, png) is already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json application/xml image/svg+xml;

    include /etc/nginx/snippets/headers.conf;

    # Crawler-facing files generated by src/app/{robots,sitemap,manifest}.ts.
    location = /robots.txt           { include /etc/nginx/snippets/headers.conf; default_type text/plain; add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location = /sitemap.xml          { include /etc/nginx/snippets/headers.conf; default_type application/xml; add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location = /manifest.webmanifest { include /etc/nginx/snippets/headers.conf; default_type application/manifest+json; add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }

    location = /healthz {
        include /etc/nginx/snippets/headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Next.js emits content-hashed filenames under /_next/static.
    location /_next/static/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Screenshots, illustrations, icons.
    location ~* \.(webp|avif|png|jpg|jpeg|gif|svg|ico|mp4|webm|woff2?)$ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Exported routes are <route>.html; anything else is a real 404.
    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/headers.conf;
        internal;
        add_header Cache-Control "no-cache";
    }

    # One URL per page: build file names and trailing slashes redirect.
    location = /index.html { return 301 /; }
    location ~ ^/(.+)\.html$ { return 301 /$1; }
    location ~ ^/(.+)/$ { return 301 /$1; }

    # The landing page. Served as a file, so the /index.html redirect above
    # does not loop.
    location = / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}
